name: Safety Wing
description: 'SafetyWing is a fintech and insurtech company providing global health and travel insurance
  for remote workers, digital nomads, and distributed teams. Its consumer product Nomad Insurance offers
  travel-medical and full health coverage across 180+ countries, while Remote Health lets companies cover
  employees and contractors worldwide under a single plan. Backed by Creandum, the company positions itself
  as building a global social safety net so that geography is no barrier to equal opportunity. As of this
  enrichment pass SafetyWing publishes no public developer API, developer portal, or API documentation; this
  profile captures its identity, public web properties, and probed domain security posture.'
